<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purchase License Key</title>
    <link
        href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-md p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <i class="fas fa-key text-4xl text-indigo-600 mb-3"></i>
                <h1 class="text-2xl font-bold text-gray-800">Purchase New License Key</h1>
                <p class="text-gray-600 mt-2">Contact us to purchase a new license key</p>
            </div>

            <div class="space-y-4">
                <div class="bg-indigo-50 p-4 rounded-lg">
                    <h3 class="font-medium text-indigo-800 flex items-center">
                        <i class="fas fa-crown mr-2"></i> Premium Features
                    </h3>
                    <ul class="mt-2 space-y-2 text-sm text-gray-700">
                        <li class="flex items-center">
                            <i class="fas fa-check text-green-500 mr-2"></i> 5 APK signatures per key
                        </li>
                        <li class="flex items-center">
                            <i class="fas fa-check text-green-500 mr-2"></i> Priority processing
                        </li>
                        <li class="flex items-center">
                            <i class="fas fa-check text-green-500 mr-2"></i> 24/7 support
                        </li>
                    </ul>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg">
                    <h3 class="font-medium text-gray-800">Payment Information</h3>
                    <div class="mt-3 space-y-2 text-sm">
                        <label for="amount" class="block text-gray-700">Amount (in cryptocurrency):</label>
                        <input
                            type="number"
                            id="amount"
                            class="border rounded-md p-2 w-full"
                            value="20"
                            min="0.01"
                            step="0.01"
                            readonly
                        />
                    </div>
                </div>

                <div class="pt-4">
                    <button
                        id="payButton"
                        class="block text-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition"
                    >
                        <i class="fas fa-dollar-sign mr-2"></i> Pay Now
                    </button>
                </div>

                <div id="paymentStatus" class="mt-4 text-center text-gray-700"></div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#payButton').on('click', function() {
                window.location.href = '/paying';
            });
        });
    </script>
</body>
</html>
