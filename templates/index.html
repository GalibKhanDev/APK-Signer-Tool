<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APK Signer - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
</head>
<body class="bg-gray-100 min-h-screen flex items-center">
    <div class="container mx-auto px-4">
        <div
            class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl"
        >
            <div class="p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-indigo-600">
                        <i class="fas fa-lock mr-2"></i>APK Signer Pro
                    </h1>
                    <p class="text-gray-500 mt-2">Sign your APKs with our premium service</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div
                    class="mb-4 p-4 rounded-md {% if category == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}"
                >
                    {{ message }}
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <form method="POST" action="/login" class="space-y-6">
                    <div>
                        <label
                            for="license_key"
                            class="block text-sm font-medium text-gray-700"
                            >License Key</label
                        >
                        <input
                            type="text"
                            id="license_key"
                            name="license_key"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                            required
                        />
                    </div>

                    <div>
                        <button
                            type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                        >
                            <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-700 mb-2">Don't have a license? Contact support</p>
                    <a
                        href="/contactbuy"
                        class="inline-block px-5 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                    >
                        <i class="fas fa-envelope mr-2"></i> Contact Support
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
